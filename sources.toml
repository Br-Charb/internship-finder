# Workday career sites (most large aerospace/defense companies).
# host + site come straight from the company's careers URL, e.g.
#   https://ngc.wd1.myworkdayjobs.com/Northrop_Grumman_External_Site
#        ^^^^^^^^^^^^^^^^^^^^^^^^^^^^ host  ^^^^^^^^^^^^^^^^^^^^^^^^^^^ site
workday = [
  { name = "Northrop Grumman", host = "ngc.wd1.myworkdayjobs.com", site = "Northrop_Grumman_External_Site" },
  { name = "Boeing", host = "boeing.wd1.myworkdayjobs.com", site = "EXTERNAL_CAREERS" },
  { name = "RTX (Raytheon, Pratt & Whitney, Collins)", host = "globalhr.wd5.myworkdayjobs.com", site = "REC_RTX_Ext_Gateway" },
  { name = "Blue Origin", host = "blueorigin.wd5.myworkdayjobs.com", site = "BlueOrigin" },
  { name = "GE Aerospace", host = "geaerospace.wd5.myworkdayjobs.com", site = "GE_ExternalSite" },
  { name = "Boeing (intern site)", host = "boeing.wd1.myworkdayjobs.com", site = "INTERN" },
  { name = "Sierra Space", host = "sierraspace.wd1.myworkdayjobs.com", site = "Sierra_Space_External_Career_Site" },
  { name = "Axiom Space", host = "axiomspace.wd5.myworkdayjobs.com", site = "External_Career_Site" },
  { name = "AeroVironment", host = "avav.wd1.myworkdayjobs.com", site = "avav" },
  { name = "Airbus", host = "ag.wd3.myworkdayjobs.com", site = "Airbus" },
  { name = "Draper", host = "draper.wd5.myworkdayjobs.com", site = "Draper_Careers" },
