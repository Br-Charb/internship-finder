name: Daily job scan

on:
  schedule:
    - cron: "15 11 * * *"   # every day at 11:15 UTC (7:15 AM Eastern in summer, 6:15 AM in winter)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for internships
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python run.py

      - name: Save results
        run: |
          git config user.name "job-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data README.md
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Job scan $(date -u +%Y-%m-%d)"
            git push
          fi
